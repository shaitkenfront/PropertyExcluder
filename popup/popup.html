<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>逆お気に入り</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <header class="header">
      <p class="eyebrow">nifty不動産</p>
      <h1>逆お気に入り</h1>
      <p class="lead">一度下した判断を、もう忘れない。</p>
    </header>

    <main>
      <section aria-labelledby="summary-title">
        <h2 id="summary-title">保存した判断</h2>
        <div class="counts">
          <div class="count count--candidate"><strong id="candidate-count">0</strong><span>候補</span></div>
          <div class="count count--hold"><strong id="hold-count">0</strong><span>保留</span></div>
          <div class="count count--rejected"><strong id="rejected-count">0</strong><span>却下</span></div>
        </div>
      </section>

      <section aria-labelledby="recent-title">
        <h2 id="recent-title">最近の判断</h2>
        <div id="recent-list" class="recent-list"></div>
      </section>
    </main>

    <footer>
      <p>データはこのChrome内だけに保存されます。</p>
      <a href="https://myhome.nifty.com/chuko-ikkodate/search/" target="_blank" rel="noreferrer">中古一戸建てを探す</a>
    </footer>

    <script src="../src/shared.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
