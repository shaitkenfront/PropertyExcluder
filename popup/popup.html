<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>逆お気に入り</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <header class="header">
      <p class="eyebrow">nifty不動産</p>
      <h1>逆お気に入り</h1>
      <p class="lead">一度下した判断を、もう忘れない。</p>
    </header>

    <main>
      <section aria-labelledby="summary-title">
        <h2 id="summary-title">保存した判断</h2>
        <div class="counts">
          <button class="count count--candidate" type="button" data-status="candidate" aria-pressed="false">
            <strong id="candidate-count">0</strong><span>候補</span>
          </button>
          <button class="count count--hold" type="button" data-status="hold" aria-pressed="false">
            <strong id="hold-count">0</strong><span>保留</span>
          </button>
          <button class="count count--rejected" type="button" data-status="rejected" aria-pressed="false">
            <strong id="rejected-count">0</strong><span>却下</span>
          </button>
        </div>
      </section>

      <section aria-labelledby="recent-title">
        <div class="list-heading">
          <h2 id="recent-title">最近の判断</h2>
          <button id="recent-view" class="back-button" type="button" hidden>最近の判断に戻す</button>
        </div>
        <div id="recent-list" class="recent-list"></div>
        <button id="list-more" class="list-more" type="button" hidden>さらに表示</button>
      </section>

      <section aria-labelledby="transfer-title">
        <h2 id="transfer-title">データの持ち運び</h2>
        <div class="transfer-actions">
          <button id="export-data" class="transfer-button" type="button">エクスポート</button>
          <button id="import-data" class="transfer-button" type="button">インポート</button>
          <input id="import-file" type="file" accept="application/json,.json" hidden>
        </div>
        <p class="transfer-help">JSONファイルで別のPCへ判定情報を移せます。同じ物件はインポート側で上書きされます。</p>
        <p id="transfer-status" class="transfer-status" aria-live="polite"></p>
      </section>
    </main>

    <footer>
      <p>データはクラウドへ送信されません。</p>
      <a href="https://myhome.nifty.com/chuko-ikkodate/search/" target="_blank" rel="noreferrer">中古一戸建てを探す</a>
    </footer>

    <script src="../src/shared.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
